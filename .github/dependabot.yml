# Lightweight dependency monitoring for the payments app. Dependabot opens PRs
# (it never auto-merges), so updates land through normal review. Minor/patch
# bumps are grouped to keep PR noise low; majors come as individual PRs.
version: 2
updates:
  # Backend (root) — the payments dependency surface (stripe, pg, axios, express, multer, body-parser)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend (Vue/Vite SPA)
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep the CI workflow's actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
