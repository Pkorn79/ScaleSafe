<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms &amp; Conditions</title>
  <style>
    :root {
      --ss-primary: #2563eb;
      --ss-primary-hover: #1d4ed8;
      --ss-text: #1f2937;
      --ss-muted: #6b7280;
      --ss-bg: #ffffff;
      --ss-border: #e5e7eb;
      --ss-accent-bg: #f0f9ff;
      --ss-error: #dc2626;
      --ss-disabled-bg: #d1d5db;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--ss-bg);
      color: var(--ss-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .ss-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Loading */
    .ss-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--ss-muted);
    }

    .ss-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--ss-border);
      border-top-color: var(--ss-primary);
      border-radius: 50%;
      animation: ss-spin 0.8s linear infinite;
    }

    @keyframes ss-spin {
      to { transform: rotate(360deg); }
    }

    .ss-loading-text {
      margin-top: 12px;
      font-size: 14px;
    }

    .ss-error-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--ss-muted);
      font-size: 15px;
    }

    /* Header */
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ss-subtitle {
      color: var(--ss-muted);
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* Clause checkboxes */
    .ss-clauses {
      margin-bottom: 24px;
    }

    .ss-clause {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--ss-border);
    }

    .ss-clause:last-child {
      border-bottom: none;
    }

    .ss-clause input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--ss-primary);
    }

    .ss-clause-content {
      flex: 1;
    }

    .ss-clause-title {
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .ss-clause-text {
      font-size: 13px;
      color: var(--ss-muted);
      margin-top: 2px;
    }

    /* Signature */
    .ss-sig-section {
      margin-bottom: 24px;
    }

    .ss-sig-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ss-muted);
      margin-bottom: 8px;
    }

    .ss-sig-notice {
      font-size: 13px;
      color: var(--ss-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .ss-sig-input {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-bottom: 2px solid var(--ss-text);
      background: transparent;
      font-size: 20px;
      font-style: italic;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--ss-text);
      outline: none;
    }

    .ss-sig-input::placeholder {
      font-size: 16px;
      font-style: italic;
      color: #9ca3af;
    }

    .ss-sig-input:focus {
      border-bottom-color: var(--ss-primary);
    }

    /* Submit */
    .ss-submit-area {
      position: relative;
    }

    .ss-form-error {
      color: var(--ss-error);
      font-size: 14px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }

    .ss-submit-btn {
      display: block;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .ss-submit-btn:disabled {
      background: var(--ss-disabled-bg);
      color: #fff;
      cursor: not-allowed;
    }

    .ss-submit-btn:not(:disabled) {
      background: var(--ss-primary);
      color: #fff;
    }

    .ss-submit-btn:not(:disabled):hover {
      background: var(--ss-primary-hover);
    }

    .ss-submit-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ss-muted);
      margin-top: 8px;
    }

    .ss-footer {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="ss-container" id="ss-root">
    <div class="ss-loading">
      <div class="ss-spinner"></div>
      <div class="ss-loading-text">Loading terms...</div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  var API_BASE = window.location.origin;
  var root = document.getElementById('ss-root');

  // Try multiple methods to get offerId (widget runs inside iframe)
  var offerId = null;

  var ownParams = new URLSearchParams(window.location.search);
  var paidEnrollmentToken = ownParams.get('paidEnrollmentToken') || '';
  try {
    if (!paidEnrollmentToken) paidEnrollmentToken = sessionStorage.getItem('ss_paid_enrollment_token') || '';
  } catch (e) { /* silent */ }

  // Method 1: Own URL params (when embed code passes it correctly)
  offerId = ownParams.get('offerId');

  // Method 2: Try parent URL (works if same origin)
  if (!offerId) {
    try {
      var parentParams = new URLSearchParams(window.parent.location.search);
      offerId = parentParams.get('offerId');
      if (!paidEnrollmentToken) paidEnrollmentToken = parentParams.get('paidEnrollmentToken') || '';
    } catch (e) { /* Cross-origin — expected */ }
  }

  // Method 3: Extract from document.referrer
  if (!offerId && document.referrer) {
    try {
      var refUrl = new URL(document.referrer);
      offerId = refUrl.searchParams.get('offerId');
      if (!paidEnrollmentToken) paidEnrollmentToken = refUrl.searchParams.get('paidEnrollmentToken') || '';
    } catch (e) { /* ignore */ }
  }

  var emailParam = ownParams.get('email') || '';
  var paymentChoiceParam = ownParams.get('paymentChoice') || '';

  if (!offerId) {
    root.innerHTML = '<div class="ss-error-msg">Terms not available. Please contact the provider.</div>';
    return;
  }
  if (paidEnrollmentToken) {
    try { sessionStorage.setItem('ss_paid_enrollment_token', paidEnrollmentToken); } catch (e) { /* silent */ }
  }

  // ─── Utilities ──────────────────────────────────────────────

  function esc(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function sha256(text) {
    var encoder = new TextEncoder();
    var data = encoder.encode(text);
    var hashBuffer = await crypto.subtle.digest('SHA-256', data);
    var hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  // ─── Collect device info ────────────────────────────────────

  var deviceInfo = {
    userAgent: navigator.userAgent,
    screenResolution: screen.width + 'x' + screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    browserLanguage: navigator.language,
    ipAddress: '',
    deviceFingerprint: ''
  };

  // Fetch IP in background
  fetch('https://api.ipify.org?format=json')
    .then(function(r) { return r.json(); })
    .then(function(d) { deviceInfo.ipAddress = d.ip || ''; })
    .catch(function() { /* silent */ });

  // Generate fingerprint
  sha256(deviceInfo.userAgent + '|' + deviceInfo.screenResolution + '|' + deviceInfo.timezone + '|' + deviceInfo.browserLanguage)
    .then(function(fp) { deviceInfo.deviceFingerprint = fp; })
    .catch(function() { /* silent */ });

  // ─── Load offer and render ──────────────────────────────────

  var offerData = null;
  var maxScrollDepth = 100; // No scroll box — terms are at external link

  fetch(API_BASE + '/api/enrollment/offer/' + encodeURIComponent(offerId) + '/public')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(offer) {
      offerData = offer;
      renderForm(offer);
    })
    .catch(function(err) {
      console.log('[ScaleSafe] Failed to load terms:', err.message);
      root.innerHTML = '<div class="ss-error-msg">Unable to load terms. Please refresh the page or contact the provider.</div>';
    });

  function renderForm(offer) {
    var html = '';
    var paymentChoice = paymentChoiceParam;
    if (!paymentChoice) {
      try {
        paymentChoice = sessionStorage.getItem('ss_payment_choice_' + offerId) || sessionStorage.getItem('ss_payment_choice') || '';
      } catch (e) {}
    }
    var hasBothPaymentOptions = offer.pifDiscountEnabled && offer.pifPrice != null && offer.installmentAmount != null && offer.installmentCount;
    if (!paymentChoice && hasBothPaymentOptions) paymentChoice = 'pif';
    var hideInstallmentClause = paymentChoice === 'pif';
    var visibleClauses = (offer.clauses || []).filter(function(clause) {
      return !(hideInstallmentClause && clause.id === 'installment_billing');
    });

    // Merchant logo + name
    if (offer.merchantLogoUrl) {
      html += '<div style="text-align:center;margin-bottom:8px;"><img src="' + esc(offer.merchantLogoUrl) + '" alt="" style="max-width:150px;height:auto;"></div>';
    }
    if (offer.merchantName) {
      html += '<p style="text-align:center;font-size:14px;color:var(--ss-muted);margin-bottom:16px;">' + esc(offer.merchantName) + '</p>';
    }

    html += '<h1>Terms &amp; Conditions</h1>';
    html += '<p class="ss-subtitle">Please review and accept the following before proceeding.</p>';

    // Section 1: Terms Document Link
    var termsUrl = window.location.origin + '/terms/' + encodeURIComponent(offer.locationId || '');
    html += '<div style="background:#f9fafb;border:1px solid var(--ss-border);border-radius:8px;padding:16px;margin-bottom:20px;">';
    html += '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Terms &amp; Conditions</p>';
    html += '<p style="font-size:14px;color:var(--ss-muted);margin-bottom:12px;">Please review the full terms and conditions before accepting.</p>';
    html += '<a href="' + esc(termsUrl) + '" target="_blank" rel="noopener" style="display:inline-block;padding:10px 20px;background:var(--ss-primary);color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;">View Full Terms &amp; Conditions</a>';
    html += '<div style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--ss-border);">';
    html += '<input type="checkbox" id="cb-terms-doc" class="ss-clause-cb" style="width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--ss-primary);cursor:pointer;">';
    html += '<label for="cb-terms-doc" style="font-size:14px;font-weight:600;cursor:pointer;">I have read and agree to the Terms &amp; Conditions</label>';
    html += '</div>';
    html += '</div>';

    // Section 2: Additional Selected Clauses (clickwrap)
    if (visibleClauses.length > 0) {
      html += '<div style="margin-bottom:24px;">';
      html += '<p style="font-size:15px;font-weight:600;margin-bottom:12px;">Additional Acknowledgments</p>';
      html += '<div class="ss-clauses">';
      visibleClauses.forEach(function(clause) {
        html += '<div class="ss-clause">';
        html += '<input type="checkbox" id="cb-' + esc(clause.id) + '" data-clause-id="' + esc(clause.id) + '" class="ss-clause-cb">';
        html += '<div class="ss-clause-content">';
        html += '<label class="ss-clause-title" for="cb-' + esc(clause.id) + '">I acknowledge: ' + esc(clause.title) + '</label>';
        if (clause.text) {
          html += '<div class="ss-clause-text">' + esc(clause.text) + '</div>';
        }
        html += '</div></div>';
      });
      html += '</div>';
      html += '</div>';
    }

    // Signature
    html += '<div class="ss-sig-section">';
    html += '<div class="ss-sig-label">Electronic Signature</div>';
    html += '<p class="ss-sig-notice">By typing your name below, you are providing your electronic signature and agreeing to all terms above.</p>';
    html += '<input type="text" id="ss-signature" class="ss-sig-input" placeholder="Type your full legal name" autocomplete="name">';
    html += '</div>';

    // Email (hidden if already in URL, visible if not)
    if (!emailParam) {
      html += '<div style="margin-bottom:20px">';
      html += '<label style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--ss-muted);display:block;margin-bottom:6px">Your Email</label>';
      html += '<input type="email" id="ss-email" style="width:100%;padding:10px 12px;border:1px solid var(--ss-border);border-radius:6px;font-size:15px;outline:none;" placeholder="your@email.com" autocomplete="email">';
      html += '</div>';
    }

    // Submit
    html += '<div class="ss-submit-area">';
    html += '<div class="ss-form-error" id="ss-error"></div>';
    html += '<button type="button" id="ss-submit" class="ss-submit-btn" disabled>I Agree to These Terms</button>';
    html += '<div class="ss-submit-hint" id="ss-hint">Please check all boxes and sign above</div>';
    html += '</div>';

    html += '<div class="ss-footer">Your consent will be recorded with a timestamp and your IP address.</div>';

    root.innerHTML = html;
    bindEvents(offer);
  }

  function bindEvents(offer) {
    var checkboxes = document.querySelectorAll('.ss-clause-cb');
    var sigInput = document.getElementById('ss-signature');
    var submitBtn = document.getElementById('ss-submit');
    var hintEl = document.getElementById('ss-hint');
    var errorEl = document.getElementById('ss-error');
    var emailInput = document.getElementById('ss-email');

    function updateSubmitState() {
      var allChecked = true;
      checkboxes.forEach(function(cb) {
        if (!cb.checked) allChecked = false;
      });

      var hasSig = sigInput.value.trim().length > 0;
      var hasEmail = emailParam || (emailInput && emailInput.value.trim().includes('@'));

      var canSubmit = allChecked && hasSig && hasEmail;
      // If no clauses, only need signature + email
      if (checkboxes.length === 0) canSubmit = hasSig && hasEmail;

      submitBtn.disabled = !canSubmit;
      hintEl.style.display = canSubmit ? 'none' : 'block';
    }

    checkboxes.forEach(function(cb) {
      cb.addEventListener('change', updateSubmitState);
    });
    sigInput.addEventListener('input', updateSubmitState);
    if (emailInput) emailInput.addEventListener('input', updateSubmitState);

    // Initial state check
    updateSubmitState();

    // Submit handler
    submitBtn.addEventListener('click', async function() {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';
      errorEl.style.display = 'none';

      try {
        var email = emailParam || (emailInput ? emailInput.value.trim() : '');

        // Compute T&C version hash
        var tcVersionHash = '';
        if (offer.compiledTcHtml) {
          tcVersionHash = await sha256(offer.compiledTcHtml);
        }

        // Collect accepted clause IDs
        var clausesAccepted = [];
        checkboxes.forEach(function(cb) {
          if (cb.checked) {
            clausesAccepted.push(cb.getAttribute('data-clause-id'));
          }
        });

        var payload = {
          offerId: offerId,
          email: email,
          paidEnrollmentToken: paidEnrollmentToken,
          consentTimestamp: new Date().toISOString(),
          ipAddress: deviceInfo.ipAddress,
          userAgent: deviceInfo.userAgent,
          deviceFingerprint: deviceInfo.deviceFingerprint,
          screenResolution: deviceInfo.screenResolution,
          timezone: deviceInfo.timezone,
          browserLanguage: deviceInfo.browserLanguage,
          tcVersionHash: tcVersionHash,
          digitalSignature: sigInput.value.trim(),
          clausesAccepted: clausesAccepted,
          scrollDepth: maxScrollDepth
        };

        var res = await fetch(API_BASE + '/api/enrollment/consent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          var errData = await res.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Server error');
        }

        var data = await res.json();

        // Store consent token for Page 4 checkout
        if (data.consentToken) {
          try {
            sessionStorage.setItem('ss_consent_token', data.consentToken);
          } catch (e) { /* silent */ }
        }

        // Free offer: enrollment is already complete — show completion screen
        if (data.freeOffer || data.paidPendingCompleted) {
          var completionText = data.paidPendingCompleted
            ? 'Your enrollment is confirmed. Payment has already been received.'
            : 'Your enrollment is confirmed. No payment required for this program.';
          root.innerHTML = '<div style="text-align:center;padding:40px 20px;">' +
            '<div style="font-size:48px;margin-bottom:16px;">&#10003;</div>' +
            '<h2 style="font-size:22px;font-weight:700;margin-bottom:8px;">You\'re Enrolled!</h2>' +
            '<p style="font-size:15px;color:var(--ss-muted);">' + completionText + '</p>' +
            '</div>';
          return;
        }

        // Brief visual confirmation, then tell parent to advance
        submitBtn.textContent = 'Consent Recorded — Redirecting...';
        submitBtn.style.background = '#16a34a';

        // Notify parent page to advance to next funnel step
        setTimeout(function() {
          try {
            window.parent.postMessage({ type: 'ssConsentComplete', consentToken: data.consentToken || '' }, '*');
          } catch (e) { /* silent */ }
        }, 800);

      } catch (err) {
        console.log('[ScaleSafe] Consent submit error:', err.message);
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'I Agree to These Terms';
        updateSubmitState();
      }
    });
  }
})();
</script>
</body>
</html>
