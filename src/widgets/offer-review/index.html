<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Review</title>
  <style>
    :root {
      --ss-primary: #2563eb;
      --ss-text: #1f2937;
      --ss-muted: #6b7280;
      --ss-bg: #ffffff;
      --ss-border: #e5e7eb;
      --ss-accent-bg: #f0f9ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--ss-bg);
      color: var(--ss-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .ss-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .ss-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--ss-muted);
    }

    .ss-spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--ss-border);
      border-top-color: var(--ss-primary);
      border-radius: 50%;
      animation: ss-spin 0.8s linear infinite;
    }

    @keyframes ss-spin {
      to { transform: rotate(360deg); }
    }

    .ss-loading-text {
      margin-top: 12px;
      font-size: 14px;
    }

    .ss-error {
      text-align: center;
      padding: 40px 20px;
      color: var(--ss-muted);
      font-size: 15px;
      line-height: 1.5;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .ss-description {
      text-align: center;
      color: var(--ss-muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .ss-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 16px;
      color: var(--ss-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ss-divider::before,
    .ss-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--ss-border);
    }

    .ss-delivery {
      font-size: 15px;
      color: var(--ss-text);
    }

    .ss-price-box {
      background: var(--ss-accent-bg);
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 8px 0;
    }

    .ss-price-main {
      font-size: 28px;
      font-weight: 700;
      color: var(--ss-primary);
    }

    .ss-price-save {
      font-size: 14px;
      color: #16a34a;
      font-weight: 600;
      margin-top: 2px;
    }

    .ss-price-or {
      color: var(--ss-muted);
      font-size: 13px;
      margin: 8px 0;
    }

    .ss-price-installment {
      font-size: 16px;
      font-weight: 500;
      color: var(--ss-text);
    }

    .ss-milestones {
      list-style: none;
    }

    .ss-milestone {
      padding: 12px 0;
      border-bottom: 1px solid var(--ss-border);
    }

    .ss-milestone:last-child {
      border-bottom: none;
    }

    .ss-milestone-name {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ss-milestone-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ss-primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .ss-milestone-detail {
      margin-left: 32px;
      font-size: 13px;
      color: var(--ss-muted);
      margin-top: 4px;
    }

    .ss-refund {
      background: #f9fafb;
      border: 1px solid var(--ss-border);
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      color: var(--ss-text);
      line-height: 1.5;
    }

    .ss-addon {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .ss-addon.order-bump {
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      padding: 12px;
    }

    .ss-addon.pre-payment-upsell {
      border: 2px solid #c7d2fe;
      background: #f8fafc;
      padding: 18px;
    }

    .ss-addon-tag {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .ss-addon-tag.order-bump {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .ss-addon-tag.pre-payment-upsell {
      background: #e0e7ff;
      color: #4338ca;
    }

    .ss-addon-title {
      display: block;
      color: var(--ss-text);
    }

    .ss-addon.pre-payment-upsell .ss-addon-title {
      font-size: 17px;
    }

    .ss-addon-price {
      white-space: nowrap;
      color: var(--ss-primary);
      font-weight: 700;
    }

    .ss-addon-copy {
      font-size: 13px;
      color: var(--ss-muted);
      margin-top: 6px;
    }

    .ss-contact {
      text-align: center;
      font-size: 14px;
      color: var(--ss-muted);
      margin-top: 24px;
    }

    .ss-contact a {
      color: var(--ss-primary);
      text-decoration: none;
    }

    .ss-contact a:hover {
      text-decoration: underline;
    }

    .ss-paid-notice {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ss-container" id="ss-root">
    <div class="ss-loading">
      <div class="ss-spinner"></div>
      <div class="ss-loading-text">Loading offer details...</div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  var API_BASE = window.location.origin;
  var root = document.getElementById('ss-root');

  // Try multiple methods to get offerId (widget runs inside iframe)
  var offerId = null;

  // Method 1: Own URL params (when embed code passes it correctly)
  offerId = new URLSearchParams(window.location.search).get('offerId');

  // Method 2: Try parent URL (works if same origin)
  if (!offerId) {
    try {
      offerId = new URLSearchParams(window.parent.location.search).get('offerId');
    } catch (e) { /* Cross-origin — expected */ }
  }

  // Method 3: Extract from document.referrer
  if (!offerId && document.referrer) {
    try {
      var refUrl = new URL(document.referrer);
      offerId = refUrl.searchParams.get('offerId');
    } catch (e) { /* ignore */ }
  }

  var paidEnrollmentToken = new URLSearchParams(window.location.search).get('paidEnrollmentToken') || '';
  if (!paidEnrollmentToken) {
    try { paidEnrollmentToken = sessionStorage.getItem('ss_paid_enrollment_token') || ''; } catch (e) { /* ignore */ }
  }
  if (!paidEnrollmentToken) {
    try { paidEnrollmentToken = new URLSearchParams(window.parent.location.search).get('paidEnrollmentToken') || ''; } catch (e) { /* ignore */ }
  }
  if (!paidEnrollmentToken && document.referrer) {
    try {
      var paidRefUrl = new URL(document.referrer);
      paidEnrollmentToken = paidRefUrl.searchParams.get('paidEnrollmentToken') || '';
    } catch (e) { /* ignore */ }
  }
  if (paidEnrollmentToken) {
    try { sessionStorage.setItem('ss_paid_enrollment_token', paidEnrollmentToken); } catch (e) { /* ignore */ }
  }

  if (!offerId) {
    root.innerHTML = '<div class="ss-error">Offer information not available. Please contact the provider.</div>';
    return;
  }

  function esc(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatCurrency(cents) {
    if (cents == null) return '';
    var dollars = Number(cents);
    return '$' + dollars.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function loadPaidContext() {
    if (!paidEnrollmentToken) return Promise.resolve(null);
    return fetch(API_BASE + '/api/enrollment/paid-context?offerId=' + encodeURIComponent(offerId) + '&paidEnrollmentToken=' + encodeURIComponent(paidEnrollmentToken))
      .then(function(res) { return res.ok ? res.json() : null; })
      .catch(function() { return null; });
  }

  Promise.all([
    fetch(API_BASE + '/api/enrollment/offer/' + encodeURIComponent(offerId) + '/public')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }),
    loadPaidContext()
  ])
    .then(function(results) {
      var offer = results[0];
      var paidContext = results[1];
      var html = '';
      if (paidContext) {
        try {
          window.parent.postMessage({ type: 'ssPaidEnrollmentContext', context: paidContext }, '*');
        } catch (postErr) { /* silent */ }
      }

      // Payment choice state
      var isPaidEnrollment = Boolean(paidContext && paidContext.paymentAlreadyReceived);
      var selectedPayment = 'pif'; // default
      var selectedAddonIds = [];

      // Merchant logo
      if (offer.merchantLogoUrl) {
        html += '<div style="text-align:center;margin-bottom:16px;"><img src="' + esc(offer.merchantLogoUrl) + '" alt="" style="max-width:150px;height:auto;"></div>';
      }

      // Headline
      html += '<p style="font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ss-muted);text-align:center;margin-bottom:8px;">Program Overview</p>';

      // Program name + delivery method badge
      html += '<h1>' + esc(offer.programName) + '</h1>';
      if (offer.deliveryMethod) {
        html += '<div style="text-align:center;margin-bottom:8px;"><span style="display:inline-block;background:#f3e8ff;color:#7c3aed;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500;">' + esc(offer.deliveryMethod) + '</span></div>';
      }

      // Program description
      if (offer.programDescription) {
        html += '<p class="ss-description">' + esc(offer.programDescription) + '</p>';
      }

      // Program duration
      if (offer.programDurationValue) {
        var unitLabel = (offer.programDurationUnit || 'weeks').charAt(0).toUpperCase() + (offer.programDurationUnit || 'weeks').slice(1);
        html += '<p style="font-size:14px;color:var(--ss-muted);text-align:center;margin-bottom:16px;">Program Duration: ' + offer.programDurationValue + ' ' + esc(unitLabel) + '</p>';
      }

      // Pricing
      html += '<div class="ss-divider">Your Investment</div>';

      var hasBothOptions = offer.pifDiscountEnabled && offer.pifPrice != null && offer.installmentAmount != null && offer.installmentCount;

      if (isPaidEnrollment) {
        var paidPaymentType = paidContext.paymentType || offer.paymentType;
        if (paidPaymentType === 'installment' || paidPaymentType === 'installments') selectedPayment = 'installments';
        else if (paidPaymentType === 'subscription') selectedPayment = 'subscription';
        else selectedPayment = 'pif';
        html += '<div class="ss-paid-notice">Payment has already been received. Please review the program details and continue to complete the enrollment packet.</div>';
        html += '<div class="ss-price-box">';
        if (selectedPayment === 'installments' && offer.installmentAmount != null && offer.installmentCount) {
          html += '<div class="ss-price-main">' + formatCurrency(offer.installmentAmount) + '<span style="font-size:16px;font-weight:400;color:var(--ss-muted)">/' + (offer.installmentFrequency || 'month') + '</span></div>';
          html += '<div class="ss-price-installment" style="margin-top:4px">' + offer.installmentCount + ' payments - already started</div>';
        } else if (selectedPayment === 'subscription' && offer.installmentAmount != null) {
          html += '<div class="ss-price-main">' + formatCurrency(offer.installmentAmount) + '<span style="font-size:16px;font-weight:400;color:var(--ss-muted)">/' + (offer.installmentFrequency || 'month') + '</span></div>';
          html += '<div class="ss-price-installment" style="margin-top:4px">Subscription - already started</div>';
        } else {
          html += '<div class="ss-price-main">' + formatCurrency(offer.pifPrice != null ? offer.pifPrice : offer.price) + '</div>';
          html += '<div class="ss-price-installment" style="margin-top:4px">Paid</div>';
        }
        html += '</div>';
      } else if (hasBothOptions) {
        // Two clickable cards side by side
        html += '<div id="ss-pricing-toggle" style="display:flex;gap:10px;margin-bottom:16px;">';

        // PIF card
        var pifSavings = (offer.price != null && offer.price > offer.pifPrice) ? (Number(offer.price) - Number(offer.pifPrice)) : 0;
        html += '<div class="ss-price-card selected" id="ss-pif-card" onclick="selectPayment(\'pif\')" style="flex:1;padding:16px;border:2px solid var(--ss-primary);border-radius:10px;background:#eff6ff;cursor:pointer;text-align:center;">';
        html += '<div style="font-size:13px;color:var(--ss-muted);margin-bottom:4px;">Pay in Full</div>';
        html += '<div style="font-size:24px;font-weight:700;color:var(--ss-primary);">' + formatCurrency(offer.pifPrice) + '</div>';
        if (pifSavings > 0) {
          html += '<div style="font-size:12px;color:#16a34a;font-weight:600;margin-top:2px;">Save ' + formatCurrency(pifSavings) + '</div>';
        }
        html += '</div>';

        // Installments card
        html += '<div class="ss-price-card" id="ss-inst-card" onclick="selectPayment(\'installments\')" style="flex:1;padding:16px;border:2px solid var(--ss-border);border-radius:10px;background:#fff;cursor:pointer;text-align:center;">';
        html += '<div style="font-size:13px;color:var(--ss-muted);margin-bottom:4px;">Payment Plan</div>';
        html += '<div style="font-size:24px;font-weight:700;color:var(--ss-text);">' + formatCurrency(offer.installmentAmount) + '<span style="font-size:14px;font-weight:400;color:var(--ss-muted)">/' + (offer.installmentFrequency || 'mo') + '</span></div>';
        html += '<div style="font-size:12px;color:var(--ss-muted);margin-top:2px;">' + offer.installmentCount + ' payments</div>';
        html += '</div>';

        html += '</div>';
      } else if (offer.paymentType === 'installment' || offer.paymentType === 'installments') {
        selectedPayment = 'installments';
        html += '<div class="ss-price-box">';
        if (offer.installmentAmount != null && offer.installmentCount) {
          html += '<div class="ss-price-main">' + formatCurrency(offer.installmentAmount) + '<span style="font-size:16px;font-weight:400;color:var(--ss-muted)">/' + (offer.installmentFrequency || 'month') + '</span></div>';
          html += '<div class="ss-price-installment" style="margin-top:4px">' + offer.installmentCount + ' payments</div>';
        }
        html += '</div>';
      } else {
        html += '<div class="ss-price-box">';
        html += '<div class="ss-price-main">' + formatCurrency(offer.price) + '</div>';
        html += '</div>';
      }

      var checkoutAddons = Array.isArray(offer.checkoutAddons) ? offer.checkoutAddons : [];
      var activeAddons = checkoutAddons.filter(function(addon) { return addon && addon.active !== false; });
      if (activeAddons.length > 0 && !isPaidEnrollment) {
        var orderBumps = activeAddons.filter(function(addon) { return addon.kind !== 'pre_payment_upsell'; });
        var upsells = activeAddons.filter(function(addon) { return addon.kind === 'pre_payment_upsell'; });

        if (orderBumps.length > 0) {
          html += '<div class="ss-divider">Add to Today\'s Checkout</div>';
          orderBumps.forEach(function(addon, i) {
            html += '<label class="ss-addon order-bump" for="ss-order-bump-' + i + '">';
            html += '<input type="checkbox" class="ss-addon-cb" id="ss-order-bump-' + i + '" data-addon-id="' + esc(addon.id) + '" style="width:18px;height:18px;margin-top:3px;flex-shrink:0;accent-color:var(--ss-primary);cursor:pointer;">';
            html += '<div style="flex:1;">';
            html += '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">';
            html += '<div><span class="ss-addon-tag order-bump">One-time add-on</span><strong class="ss-addon-title">' + esc(addon.title) + '</strong></div>';
            html += '<span class="ss-addon-price">' + formatCurrency(addon.price) + '</span>';
            html += '</div>';
            if (addon.description) html += '<div class="ss-addon-copy">' + esc(addon.description) + '</div>';
            html += '</div></label>';
          });
        }

        if (upsells.length > 0) {
          html += '<div class="ss-divider">Optional Upgrade</div>';
          upsells.forEach(function(addon, i) {
            html += '<label class="ss-addon pre-payment-upsell" for="ss-upsell-' + i + '">';
            html += '<input type="checkbox" class="ss-addon-cb" id="ss-upsell-' + i + '" data-addon-id="' + esc(addon.id) + '" style="width:20px;height:20px;margin-top:4px;flex-shrink:0;accent-color:var(--ss-primary);cursor:pointer;">';
            html += '<div style="flex:1;">';
            html += '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">';
            html += '<div><span class="ss-addon-tag pre-payment-upsell">One-time upgrade</span><strong class="ss-addon-title">' + esc(addon.title) + '</strong></div>';
            html += '<span class="ss-addon-price">' + formatCurrency(addon.price) + '</span>';
            html += '</div>';
            if (addon.description) html += '<div class="ss-addon-copy">' + esc(addon.description) + '</div>';
            html += '</div></label>';
          });
        }
      }

      // Milestones with clickwrap
      if (offer.milestones && offer.milestones.length > 0) {
        html += '<div class="ss-divider">Program Milestones</div>';
        html += '<p style="font-size:14px;color:var(--ss-muted);margin-bottom:12px;">Please review each milestone and confirm you understand what is included and what is expected of you.</p>';
        html += '<ul class="ss-milestones">';
        offer.milestones.forEach(function(m, i) {
          html += '<li class="ss-milestone">';
          html += '<div style="display:flex;gap:10px;align-items:flex-start;">';
          html += '<input type="checkbox" class="ss-milestone-cb" id="ms-cb-' + i + '" style="width:18px;height:18px;margin-top:3px;flex-shrink:0;accent-color:var(--ss-primary);cursor:pointer;">';
          html += '<div>';
          html += '<label class="ss-milestone-name" for="ms-cb-' + i + '" style="cursor:pointer;"><span class="ss-milestone-num">' + (i + 1) + '</span>' + esc(m.name) + '</label>';
          if (m.delivers) {
            html += '<div class="ss-milestone-detail">What you\'ll receive: ' + esc(m.delivers) + '</div>';
          }
          if (m.clientDoes) {
            html += '<div class="ss-milestone-detail">What you\'ll do: ' + esc(m.clientDoes) + '</div>';
          }
          html += '</div></div>';
          html += '</li>';
        });
        html += '</ul>';
      }

      // Refund policy
      if (offer.refundWindowText) {
        html += '<div class="ss-divider">Refund Policy</div>';
        html += '<div class="ss-refund">' + esc(offer.refundWindowText) + '</div>';
      }

      // Contact
      if (offer.merchantName) {
        html += '<div class="ss-contact">';
        html += 'Questions? Contact ' + esc(offer.merchantName);
        if (offer.merchantSupportEmail) {
          html += '<br><a href="mailto:' + esc(offer.merchantSupportEmail) + '">' + esc(offer.merchantSupportEmail) + '</a>';
        }
        html += '</div>';
      }

      // Continue button
      var hasMilestones = offer.milestones && offer.milestones.length > 0;
      html += '<div style="margin-top:24px;">';
      html += '<button type="button" id="ss-continue" style="display:block;width:100%;height:48px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:' + (hasMilestones ? '#93c5fd' : '#3b82f6') + ';"' + (hasMilestones ? ' disabled' : '') + '>Continue</button>';
      if (hasMilestones) {
        html += '<div id="ss-continue-hint" style="text-align:center;font-size:12px;color:#6b7280;margin-top:8px;">Please check all milestone boxes above to continue</div>';
      }
      html += '</div>';

      root.innerHTML = html;

      // Payment choice toggle
      window.selectPayment = function(choice) {
        selectedPayment = choice;
        try {
          sessionStorage.setItem('ss_payment_choice_' + offerId, choice);
          sessionStorage.setItem('ss_payment_choice', choice);
        } catch(e) {}
        var pifCard = document.getElementById('ss-pif-card');
        var instCard = document.getElementById('ss-inst-card');
        if (pifCard && instCard) {
          if (choice === 'pif') {
            pifCard.style.borderColor = '#2563eb'; pifCard.style.background = '#eff6ff';
            instCard.style.borderColor = '#e5e7eb'; instCard.style.background = '#fff';
          } else {
            instCard.style.borderColor = '#2563eb'; instCard.style.background = '#eff6ff';
            pifCard.style.borderColor = '#e5e7eb'; pifCard.style.background = '#fff';
          }
        }
      };

      // Milestone checkbox + continue button logic
      var milestoneCbs = document.querySelectorAll('.ss-milestone-cb');
      var addonCbs = document.querySelectorAll('.ss-addon-cb');
      var continueBtn = document.getElementById('ss-continue');
      var continueHint = document.getElementById('ss-continue-hint');

      function persistAddons() {
        selectedAddonIds = [];
        addonCbs.forEach(function(cb) {
          if (cb.checked) selectedAddonIds.push(cb.getAttribute('data-addon-id'));
        });
        try {
          sessionStorage.setItem('ss_selected_addons_' + offerId, JSON.stringify(selectedAddonIds));
          sessionStorage.setItem('ss_selected_addons', JSON.stringify(selectedAddonIds));
        } catch(e) {}
      }

      function updateContinueState() {
        var allChecked = true;
        milestoneCbs.forEach(function(cb) { if (!cb.checked) allChecked = false; });
        if (continueBtn) {
          continueBtn.disabled = !allChecked;
          continueBtn.style.background = allChecked ? '#3b82f6' : '#93c5fd';
          continueBtn.style.cursor = allChecked ? 'pointer' : 'not-allowed';
        }
        if (continueHint) continueHint.style.display = allChecked ? 'none' : 'block';
        try {
          window.parent.postMessage({ type: 'ssMilestonesState', allChecked: allChecked }, '*');
        } catch(e) {}
      }

      milestoneCbs.forEach(function(cb) { cb.addEventListener('change', updateContinueState); });
      addonCbs.forEach(function(cb) { cb.addEventListener('change', persistAddons); });

      if (continueBtn) {
        continueBtn.addEventListener('click', function() {
          if (!continueBtn.disabled) {
            try {
              persistAddons();
              sessionStorage.setItem('ss_payment_choice_' + offerId, selectedPayment);
              sessionStorage.setItem('ss_payment_choice', selectedPayment);
              window.parent.postMessage({ type: 'ssMilestonesComplete', paymentChoice: selectedPayment, selectedAddonIds: selectedAddonIds }, '*');
            } catch(e) {}
          }
        });
      }
    })
    .catch(function(err) {
      console.log('[ScaleSafe] Offer load error:', err.message);
      root.innerHTML = '<div class="ss-error">Unable to load offer details. Please refresh the page or contact the provider.</div>';
    });
})();
</script>
</body>
</html>
